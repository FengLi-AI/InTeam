                  - due_hint
                  - topic_key
                  - related_contact_key
                  - source
                  type: object
                type: array
              answer_status:
                type: string
              related_contact_keys:
                items:
                  type: string
                type: array
              suggested_questions:
                items:
                  type: string
                type: array
            required:
            - answer_status
            - suggested_questions
            - action_suggestions
            - related_contact_keys
            type: object
        structured_output_enabled: true
        title: 结构化建议
